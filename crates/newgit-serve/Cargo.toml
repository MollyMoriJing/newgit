[package]
name = "newgit-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The newgit remote: Git repositories on local disk, project state in SQLite"

[lints]
workspace = true

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
base64 = "0.22"
camino = "1.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
hmac = "0.13"
newgit-core = { path = "../newgit-core", version = "0.10.0" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1.1"
flate2 = "1"
ureq = { version = "3.4.2", features = ["json"] }
